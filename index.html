<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nexus</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #050508;
            --text: rgba(255, 255, 255, 0.9);
            --dim: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Inter;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            inset: 0;
            touch-action: none;
            user-select: none;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-family: "Space Mono";
            font-size: 12px;
            color: var(--dim);
            pointer-events: none;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: "Space Mono";
            font-size: 12px;
            color: var(--dim);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <header>
        <div>NEXUS</div>
        <div id="count"></div>
    </header>

    <footer>
        <div>Haz click en un nodo</div>
    </footer>

    <script>
        const projects = [
            // { title: 'READS', color: '#ffaa00', url: 'https://apipiunai.github.io/reads' },
            // { title: 'COLD TRACKER', color: '#fa70ff', url: 'https://apipiunai.github.io/cold-tracker' },
            { title: 'ARCHIMEDES', color: '#00e5ff', url: 'https://apipiunai.github.io/archimedes' },
            { title: 'SCADA', color: '#ff1744', url: 'https://apipiunai.github.io/scada' },
            { title: 'DOCUFLOW', color: '#ffd600', url: 'https://apipiunai.github.io/docuflow' },
            { title: 'VYNO AI', color: '#7dff00', url: 'https://apipiunai.github.io/vyno' },
            { title: 'VENUS GYM', color: '#2979ff', url: 'https://apipiunai.github.io/gym' },
            { title: 'DOWNLOADER', color: '#ff00aa', url: 'https://github.com/apipiunai/downloader' },
            { title: 'W-MANAGER', color: '#56b37e', url: 'https://apipiunai.github.io/web-manager' },
        ];

        document.getElementById('count').textContent = projects.length + " NODES";

        /* CANVAS */
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        let W, H, cx, cy, dpr = window.devicePixelRatio || 1;

        function resize() {
            W = innerWidth; H = innerHeight;
            c.width = W * dpr; c.height = H * dpr;
            c.style.width = W + "px"; c.style.height = H + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = W / 2; cy = H / 2;
        }
        addEventListener('resize', resize);
        resize();

        /* PARTICLES (S-motion, fondo) */
        let stars = [];
        function initStars() {
            stars = [];
            const n = Math.min(100, (W * H) / 12000);
            for (let i = 0; i < n; i++) {
                stars.push({
                    bx: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.5,
                    a: Math.random() * 0.4 + 0.1,
                    vy: Math.random() * 0.8 + 0.4,
                    amp: Math.random() * 30 + 10,
                    freq: Math.random() * 0.002 + 0.001,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        initStars();

        /* ============ MATEMATICA 3D (cuaterniones) ============ */
        // q = [w, x, y, z]
        function quatMultiply(a, b) {
            const [aw, ax, ay, az] = a, [bw, bx, by, bz] = b;
            return [
                aw * bw - ax * bx - ay * by - az * bz,
                aw * bx + ax * bw + ay * bz - az * by,
                aw * by - ax * bz + ay * bw + az * bx,
                aw * bz + ax * by - ay * bx + az * bw
            ];
        }
        function quatNormalize(q) {
            const len = Math.sqrt(q[0] * q[0] + q[1] * q[1] + q[2] * q[2] + q[3] * q[3]) || 1;
            return [q[0] / len, q[1] / len, q[2] / len, q[3] / len];
        }
        function quatFromAxisAngle(axis, angle) {
            const half = angle / 2, s = Math.sin(half);
            return [Math.cos(half), axis[0] * s, axis[1] * s, axis[2] * s];
        }
        function quatToMatrix(q) {
            const [w, x, y, z] = q;
            return [
                1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w),
                2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w),
                2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)
            ];
        }
        function applyMatrix(m, v) {
            return {
                x: m[0] * v.x + m[1] * v.y + m[2] * v.z,
                y: m[3] * v.x + m[4] * v.y + m[5] * v.z,
                z: m[6] * v.x + m[7] * v.y + m[8] * v.z
            };
        }

        // Distribuye N puntos de forma uniforme sobre una esfera (espiral de Fibonacci),
        // usado como punto de partida para la relajación.
        function fibonacciSphere(n) {
            const pts = [];
            if (n === 1) return [{ x: 0, y: 0, z: 1 }];
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < n; i++) {
                const y = 1 - (i / (n - 1)) * 2;
                const r = Math.sqrt(Math.max(0, 1 - y * y));
                const theta = goldenAngle * i;
                pts.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r });
            }
            return pts;
        }

        // Variante de la espiral con jitter aleatorio, para generar puntos de
        // partida distintos entre si en cada intento de bestSphereDistribution.
        function jitteredSphereStart(n) {
            return fibonacciSphere(n).map(p => {
                const jx = p.x + (Math.random() - 0.5) * 0.6;
                const jy = p.y + (Math.random() - 0.5) * 0.6;
                const jz = p.z + (Math.random() - 0.5) * 0.6;
                const len = Math.sqrt(jx * jx + jy * jy + jz * jz) || 1;
                return { x: jx / len, y: jy / len, z: jz / len };
            });
        }

        // Repulsión tipo Thomson (como electrones sobre una esfera): relaja un
        // set de puntos de partida para que la distancia entre nodos vecinos
        // sea lo más uniforme posible.
        function relaxSphere(points, iterations = 300) {
            const pts = points.map(p => ({ ...p }));
            const n = pts.length;
            for (let iter = 0; iter < iterations; iter++) {
                const step = 0.22 * (1 - iter / iterations) + 0.01;
                const fx = new Array(n).fill(0), fy = new Array(n).fill(0), fz = new Array(n).fill(0);
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        let dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, dz = pts[i].z - pts[j].z;
                        let d2 = dx * dx + dy * dy + dz * dz;
                        if (d2 < 1e-6) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; dz = Math.random() - 0.5; d2 = 1e-6; }
                        const d = Math.sqrt(d2);
                        const f = 1 / d2; // repulsión inversamente proporcional al cuadrado de la distancia
                        fx[i] += (dx / d) * f; fy[i] += (dy / d) * f; fz[i] += (dz / d) * f;
                        fx[j] -= (dx / d) * f; fy[j] -= (dy / d) * f; fz[j] -= (dz / d) * f;
                    }
                }
                for (let i = 0; i < n; i++) {
                    pts[i].x += fx[i] * step;
                    pts[i].y += fy[i] * step;
                    pts[i].z += fz[i] * step;
                    const len = Math.sqrt(pts[i].x ** 2 + pts[i].y ** 2 + pts[i].z ** 2) || 1;
                    pts[i].x /= len; pts[i].y /= len; pts[i].z /= len;
                }
            }
            return pts;
        }

        // Energia potencial total (suma de 1/distancia entre cada par de
        // puntos) - metrica estandar del problema de Thomson. A menor
        // energia, distribucion mas uniforme/simetrica.
        function sphereEnergy(pts) {
            let e = 0;
            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, dz = pts[i].z - pts[j].z;
                    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
                    e += 1 / d;
                }
            }
            return e;
        }

        // relaxSphere puede quedar atrapado en un minimo local asimetrico
        // dependiendo del punto de partida. Para conseguir SIEMPRE la
        // distribucion mas simetrica posible, sea cual sea N, se relaja desde
        // varios puntos de partida distintos y nos quedamos con el de menor
        // energia (el mas uniforme). Se ajusta solo al numero de nodos.
        function bestSphereDistribution(n, attempts = 25, iterations = 300) {
            let best = null, bestEnergy = Infinity;
            for (let a = 0; a < attempts; a++) {
                const start = a === 0 ? fibonacciSphere(n) : jitteredSphereStart(n);
                const relaxed = relaxSphere(start, iterations);
                const e = sphereEnergy(relaxed);
                if (e < bestEnergy) { bestEnergy = e; best = relaxed; }
            }
            return best;
        }

        const basePositions = bestSphereDistribution(projects.length);

        let orientation = [1, 0, 0, 0];       // cuaternión identidad
        let angularVelocity = { axis: [0, 1, 0], angle: 0 }; // inercia
        const ROTATE_SPEED = 0.0055;
        const DAMPING = 0.94;
        const IDLE_SPEED = 0.0015;
        const PERSPECTIVE = 900;
        const R = 0.40; // radio de la esfera relativo a min(W,H)

        let nodesScreen = []; // proyección 2D del último frame (para hover/click)

        /* INTERACCION */
        let hovered = -1;
        let pointerDown = false, isDragging = false;
        let startX = 0, startY = 0, lastX = 0, lastY = 0;
        const THRESHOLD = 5;

        c.addEventListener('pointerdown', e => {
            pointerDown = true;
            isDragging = false;
            startX = lastX = e.clientX;
            startY = lastY = e.clientY;
            angularVelocity.angle = 0;
            c.setPointerCapture(e.pointerId);
        });

        c.addEventListener('pointermove', e => {
            const x = e.clientX, y = e.clientY;

            if (!pointerDown) {
                hovered = getNode(x, y);
                c.style.cursor = hovered !== -1 ? 'pointer' : 'default';
                return;
            }

            const totalDist = Math.hypot(x - startX, y - startY);
            if (!isDragging && totalDist > THRESHOLD) {
                isDragging = true;
                hovered = -1;
            }

            if (isDragging) {
                const dx = x - lastX, dy = y - lastY;
                const dist = Math.hypot(dx, dy);
                if (dist > 0.0001) {
                    // Eje perpendicular al arrastre en el plano de pantalla ->
                    // rotación libre en cualquier dirección (trackball).
                    const axis = [-dy / dist, dx / dist, 0];
                    const angle = dist * ROTATE_SPEED;
                    orientation = quatNormalize(quatMultiply(quatFromAxisAngle(axis, angle), orientation));
                    angularVelocity = { axis, angle };
                }
            }
            lastX = x; lastY = y;
        });

        c.addEventListener('pointerup', e => {
            if (!isDragging && pointerDown) {
                const i = getNode(e.clientX, e.clientY);
                if (typeof i === 'number' && i >= 0) {
                    localStorage.setItem("last_node", projects[i].title);
                    window.open(projects[i].url, '_blank');
                }
            }
            pointerDown = false;
            isDragging = false;
            c.releasePointerCapture(e.pointerId);
        });

        c.addEventListener('wheel', e => {
            const angle = e.deltaY * 0.0018;
            const axis = [0, 1, 0];
            orientation = quatNormalize(quatMultiply(quatFromAxisAngle(axis, angle), orientation));
            angularVelocity = { axis, angle: angle * 0.6 };
        }, { passive: true });

        function getNode(x, y) {
            const dcx = x - cx, dcy = y - cy;
            if (dcx * dcx + dcy * dcy < 900) return 'center';

            for (let i = 0; i < nodesScreen.length; i++) {
                const n = nodesScreen[i];
                if (n.hidden) continue;
                const dx = x - n.x, dy = y - n.y;
                if (dx * dx + dy * dy < 900) return i;
            }
            return -1;
        }

        function mapRange(v, a, b, c, d) {
            const t = (v - a) / (b - a);
            return c + Math.max(0, Math.min(1, t)) * (d - c);
        }

        /* DRAW */
        let ringRot = 0;
        function draw(t) {
            ctx.clearRect(0, 0, W, H);

            /* rotación: inercia tras soltar, o giro ambiental si está quieto */
            if (!pointerDown) {
                if (Math.abs(angularVelocity.angle) > 0.00005) {
                    orientation = quatNormalize(quatMultiply(
                        quatFromAxisAngle(angularVelocity.axis, angularVelocity.angle), orientation));
                    angularVelocity.angle *= DAMPING;
                } else {
                    orientation = quatNormalize(quatMultiply(
                        quatFromAxisAngle([0, 1, 0], IDLE_SPEED), orientation));
                }
            }

            /* particulas de fondo */
            for (const s of stars) {
                s.y -= s.vy;
                if (s.y < -20) { s.y = H + 20; s.bx = Math.random() * W; }
                const x = s.bx + Math.sin(t * s.freq + s.phase) * s.amp;
                ctx.globalAlpha = s.a;
                ctx.beginPath();
                ctx.arc(x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            /* proyección 3D -> 2D */
            const sphereR = Math.min(W, H) * R;
            const m = quatToMatrix(orientation);
            const projected = basePositions.map((p, i) => {
                const v = applyMatrix(m, p);
                const scale = PERSPECTIVE / (PERSPECTIVE - v.z * sphereR);
                return {
                    i,
                    x: cx + v.x * sphereR * scale,
                    y: cy + v.y * sphereR * scale,
                    z: v.z,
                    scale,
                    hidden: false
                };
            });
            nodesScreen = projected; // para hit-testing (índice = orden original)

            /* silueta de la esfera */
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(cx, cy, sphereR, 0, Math.PI * 2);
            ctx.stroke();

            /* orden de pintado: de más lejano a más cercano (pintor) */
            const order = [...projected].sort((a, b) => a.z - b.z);

           /* conexiones orbe central -> nodos */
for (const n of order) {
    ctx.strokeStyle = `rgba(255,255,255,${mapRange(n.z, -1, 1, 0.03, 0.14)})`;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(n.x, n.y);
    ctx.stroke();
}

            /* centro: glow */
            const pulse = Math.sin(t * 0.002) * 0.3 + 0.7;
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
            g.addColorStop(0, `rgba(255,255,255,${0.15 * pulse})`);
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, 120, 0, Math.PI * 2);
            ctx.fill();

            /* anillo APIPI (detras) */
            ringRot += 0.01;
            ctx.font = '8px "Space Mono"';
            for (let i = 0; i < 5; i++) {
                const a = (i / 5) * Math.PI * 2 + ringRot;
                if (Math.sin(a) < 0) {
                    const x = cx + Math.cos(a) * 55;
                    const y = cy + Math.sin(a) * 18;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillText("APIPI", x, y);
                }
            }

            /* orbe central */
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${0.9 * pulse})`;
            ctx.fill();

            /* anillo APIPI (delante) */
            for (let i = 0; i < 5; i++) {
                const a = (i / 5) * Math.PI * 2 + ringRot;
                if (Math.sin(a) >= 0) {
                    const x = cx + Math.cos(a) * 55;
                    const y = cy + Math.sin(a) * 18;
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.fillText("APIPI", x, y);
                }
            }

            /* anillo central */
            ctx.beginPath();
            ctx.arc(cx, cy, 80, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255,255,255,${hovered === 'center' ? 0.3 : 0.1})`;
            ctx.lineWidth = hovered === 'center' ? 2 : 1;
            ctx.stroke();
            ctx.lineWidth = 1;

            /* nodos, de más lejano a más cercano */
            ctx.textAlign = 'center';
            const flicker = Math.sin(t * 0.008) * 0.3 + 0.7;

            for (const n of order) {
                const p = projects[n.i];
                const isH = n.i === hovered;
                const depthAlpha = mapRange(n.z, -1, 1, 0.35, 1);
                const size = (isH ? 12.5 : 7.5) * Math.max(0.55, n.scale * 0.9);

                ctx.globalAlpha = (isH ? 0.25 : 0.1) * flicker * depthAlpha;
                ctx.beginPath();
                ctx.arc(n.x, n.y, size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                ctx.globalAlpha = depthAlpha;
                ctx.beginPath();
                ctx.arc(n.x, n.y, size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                if (isH) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, size + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color;
                    ctx.stroke();
                }

                ctx.font = (isH ? '13px' : '11px') + ' "Space Mono"';
                ctx.fillStyle = p.color;
                const labelOffset = n.y < cy ? -(size + 14) : size + 18;
                ctx.fillText(p.title, n.x, n.y + labelOffset);
            }
            ctx.globalAlpha = 1;

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>

</html>
